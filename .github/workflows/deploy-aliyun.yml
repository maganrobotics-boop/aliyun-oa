name: Deploy oa to Aliyun
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      # Release tooling is installed separately; a tooling-only merge must not
      # replace newer production application code with the repository snapshot.
      - 'deploy/aliyun/**'
      - 'tests/aliyun-release-preflight.test.py'
      - '.github/workflows/check-aliyun-release-preflight.yml'
      - '.github/workflows/deploy-aliyun.yml'
concurrency:
  group: deploy-oa-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY_B64: ${{ secrets.OMINDOS_SSH_KEY_B64 }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/omindos
          chmod 600 ~/.ssh/omindos
          ssh-keyscan -H 39.108.50.65 >> ~/.ssh/known_hosts
      - name: Deploy exact commit
        run: ssh -i ~/.ssh/omindos -o IdentitiesOnly=yes admin@39.108.50.65 "sudo /opt/omindos-deploy/bin/deploy-from-github.sh oa ${GITHUB_SHA}"
