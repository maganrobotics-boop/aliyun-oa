# Included only by the oa.omindos.cn HTTPS server.
location = /oa-login-recovery.js {
    alias /opt/omindos-deploy/oa-login-recovery-20261014/oa-login-recovery.js;
    types { }
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}

# Compress public immutable assets only; do not change API/auth response handling.
location ^~ /_next/static/ {
    gzip on;
    gzip_types application/javascript text/javascript text/css;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header oai-authenticated-user-email "";
    proxy_set_header oai-authenticated-user-full-name "";
    proxy_set_header oai-authenticated-user-full-name-encoding "";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Connection "";
    proxy_buffering on;
    proxy_read_timeout 30s;
}
